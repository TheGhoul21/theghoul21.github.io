<script>

class AmariNetwork {
    constructor(width, height, tau = 1.0, threshold = 0.1) {
        this.width = width;
        this.height = height;
        this.numNeurons = width * height;
        this.state = new Float32Array(this.numNeurons);
        this.tau = tau;          // Time constant
        this.threshold = threshold;  // Activation threshold

        // Optimized Mexican hat kernel with precomputed distances
        this.weights = this.createOptimizedKernel();
    }

    // Optimized kernel creation using memoization
    createOptimizedKernel() {
        const weights = new Float32Array(this.numNeurons * this.numNeurons);
        const excitWidth = 5;
        const inhWidth = 15;
        const excitStrength = 2.0;
        const inhStrength = 1.0;

        // Precompute relative distances
        const distances = new Array(this.numNeurons);
        for (let i = 0; i < this.numNeurons; i++) {
            const x1 = i % this.width;
            const y1 = Math.floor(i / this.width);
            distances[i] = [];

            for (let j = 0; j < this.numNeurons; j++) {
                const x2 = j % this.width;
                const y2 = Math.floor(j / this.width);
                const dx = Math.min(Math.abs(x1 - x2), this.width - Math.abs(x1 - x2));
                const dy = Math.min(Math.abs(y1 - y2), this.height - Math.abs(y1 - y2));
                distances[i][j] = Math.sqrt(dx*dx + dy*dy);
            }
        }

        // Compute weights using precomputed distances
        for (let i = 0; i < this.numNeurons; i++) {
            for (let j = 0; j < this.numNeurons; j++) {
                const dist = distances[i][j];
                const excit = excitStrength * Math.exp(-(dist * dist) / (2 * excitWidth * excitWidth));
                const inhib = inhStrength * Math.exp(-(dist * dist) / (2 * inhWidth * inhWidth));
                weights[i * this.numNeurons + j] = excit - inhib;
            }
        }

        return weights;
    }

    // Apply stimulus input to the neural field
    applyStimulus(stimulus, strength = 1.0) {
        for (let i = 0; i < this.numNeurons; i++) {
            this.state[i] += strength * stimulus[i];
        }
        return [...this.state];
    }

    // Update function implementing the Amari neural field dynamics
    // u_t = -u + w * f(u) + h
    // where:
    // u is the neural activity
    // w is the connectivity kernel (Mexican hat)
    // f is the firing rate function (sigmoid)
    // h is a constant bias/threshold
    update(dt = 0.1, externalInput = null) {
        const newState = new Float32Array(this.numNeurons);

        // First calculate the network input to each neuron
        for (let i = 0; i < this.numNeurons; i++) {
            let input = 0;

            // Calculate sum of weighted inputs
            for (let j = 0; j < this.numNeurons; j++) {
                // Apply activation function to current state
                const activation = this.sigmoid(this.state[j]);
                input += this.weights[i * this.numNeurons + j] * activation;
            }

            // Apply external input if provided
            if (externalInput && externalInput[i]) {
                input += externalInput[i];
            }

            // Amari neural field equation: τ du/dt = -u + input
            // Discretized as: u(t+dt) = u(t) + dt/τ * (-u(t) + input)
            newState[i] = this.state[i] + (dt / this.tau) * (-this.state[i] + input);
        }

        // Update state
        this.state = newState;
        return [...this.state];
    }

    // Sigmoid activation function
    sigmoid(x) {
        return 1 / (1 + Math.exp(-(x - this.threshold) * 10));
    }

    // Reset state with some noise
    resetState(noiseLevel = 0.1) {
        for (let i = 0; i < this.numNeurons; i++) {
            this.state[i] = (Math.random() * 2 - 1) * noiseLevel;
        }
        return [...this.state];
    }

    // Initialize with a stimulus pattern
    initializeWithStimulus(pattern, strength = 1.0) {
        this.resetState(0.01); // Start with minimal noise
        this.applyStimulus(pattern, strength);
        return [...this.state];
    }

    // Calculate system energy (Lyapunov function for neural field)
    energy() {
        let energy = 0;

        // Sum of squared activities
        for (let i = 0; i < this.numNeurons; i++) {
            energy += 0.5 * this.state[i] * this.state[i];
        }

        // Subtract interaction energy
        for (let i = 0; i < this.numNeurons; i++) {
            for (let j = 0; j < this.numNeurons; j++) {
                const activation_i = this.sigmoid(this.state[i]);
                const activation_j = this.sigmoid(this.state[j]);
                energy -= 0.5 * this.weights[i * this.numNeurons + j] * activation_i * activation_j;
            }
        }

        return energy;
    }
}

// Create patterns
const WIDTH = 64;
const HEIGHT = 64;
const cellSize = 8; // Fixed cell size for canvas

function createPattern(drawFn) {
    const pattern = new Array(WIDTH * HEIGHT).fill(0);
    drawFn(pattern);
    return pattern;
}

// Sample stimuli for the neural field
const stimuli = [
    // Circular bump (typical Amari model bump stimulus)
    createPattern((p) => {
        const centerX = WIDTH / 2;
        const centerY = HEIGHT / 2;
        const radius = WIDTH / 8;

        for (let y = 0; y < HEIGHT; y++) {
            for (let x = 0; x < WIDTH; x++) {
                const dist = Math.sqrt(Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2));
                if (dist < radius) {
                    p[y * WIDTH + x] = 1;
                }
            }
        }
    }),
    // Multiple bumps (to show interaction effects)
    createPattern((p) => {
        const centers = [
            { x: WIDTH / 4, y: HEIGHT / 4, radius: WIDTH / 12 },
            { x: 3 * WIDTH / 4, y: HEIGHT / 4, radius: WIDTH / 12 },
            { x: WIDTH / 4, y: 3 * HEIGHT / 4, radius: WIDTH / 12 },
            { x: 3 * WIDTH / 4, y: 3 * HEIGHT / 4, radius: WIDTH / 12 }
        ];

        for (let y = 0; y < HEIGHT; y++) {
            for (let x = 0; x < WIDTH; x++) {
                for (const center of centers) {
                    const dist = Math.sqrt(Math.pow(x - center.x, 2) + Math.pow(y - center.y, 2));
                    if (dist < center.radius) {
                        p[y * WIDTH + x] = 1;
                    }
                }
            }
        }
    }),
    // Horizontal bar (to show lateral inhibition effects)
    createPattern((p) => {
        const centerY = HEIGHT / 2;
        const barHeight = HEIGHT / 8;

        for (let y = 0; y < HEIGHT; y++) {
            for (let x = 0; x < WIDTH; x++) {
                if (Math.abs(y - centerY) < barHeight / 2) {
                    p[y * WIDTH + x] = 1;
                }
            }
        }
    }),
];

function initializeVisualization() {
    // Clear existing content
    d3.select("#amari-container").html("");

    // Use Canvas for better performance
    const canvas = d3.select("#amari-container")
        .append("canvas")
        .attr("width", WIDTH)
        .attr("height", HEIGHT)
        .style("image-rendering", "pixelated")
        .style("width", `${WIDTH * cellSize}px`)
        .style("height", `${HEIGHT * cellSize}px`)
        .style("border", "2px solid #333")
        .style("border-radius", "8px");

    const ctx = canvas.node().getContext('2d');
    const imageData = ctx.createImageData(WIDTH, HEIGHT);

    // Initialize network with default parameters
    const network = new AmariNetwork(WIDTH, HEIGHT, 1.0, 0.1);

    // UI layout dimensions
    const margin = { top: 20, right: 20, bottom: 60, left: 20 };
    const containerWidth = Math.min(800, window.innerWidth - 100);
    const containerHeight = Math.min(500, window.innerHeight - 200);
    const width = WIDTH * cellSize; // Use fixed cellSize for layout
    const height = HEIGHT * cellSize;

    // Create main container
    const container = d3.select("#amari-container")
        .append("div")
        .style("display", "flex")
        .style("flex-direction", "column")
        .style("align-items", "center")
        .style("gap", "1rem");

    // Create visualization container (grid + plot)
    const vizContainer = container.append("div")
        .style("display", "flex")
        .style("gap", "2rem")
        .style("align-items", "center")
        .style("flex-wrap", "wrap")
        .style("justify-content", "center");

    // Left column for network activity grid
    const leftColumn = vizContainer.append("div");

    // Right column for pattern overlap plot
    const rightColumn = vizContainer.append("div");

    // Append canvas to left column
    leftColumn.node().appendChild(canvas.node()); // Append raw canvas node

    // Create SVG for overlap plot
    const plotWidth = 300;
    const plotHeight = 200;
    const plotMargin = { top: 20, right: 20, bottom: 30, left: 50 };

    const plotSvg = rightColumn.append("svg")
        .attr("width", plotWidth + plotMargin.left + plotMargin.right)
        .attr("height", plotHeight + plotMargin.top + plotMargin.bottom)
        .append("g")
        .attr("transform", `translate(${plotMargin.left},${plotMargin.top})`);

    // Add plot title
    plotSvg.append("text")
        .attr("x", plotWidth / 2)
        .attr("y", -5)
        .attr("text-anchor", "middle")
        .style("font-size", "14px")
        .text("Energy Landscape");

    // Initialize energy history
    let energyHistory = [];
    const maxHistoryLength = 100;

    // Create scales for energy plot
    const xScale = d3.scaleLinear()
        .domain([0, maxHistoryLength])
        .range([0, plotWidth]);

    const yScale = d3.scaleLinear()
        .domain([-10, 0])  // Energy typically decreases to negative values
        .range([plotHeight, 0]);

    // Create axes
    const xAxis = d3.axisBottom(xScale)
        .ticks(5);
    const yAxis = d3.axisLeft(yScale)
        .ticks(5);

    // Add axes to plot
    plotSvg.append("g")
        .attr("class", "x-axis")
        .attr("transform", `translate(0,${plotHeight})`)
        .call(xAxis);

    plotSvg.append("g")
        .attr("class", "y-axis")
        .call(yAxis);

    // Create line generator
    const line = d3.line()
        .x((d, i) => xScale(i))
        .y(d => yScale(d));

    // Add path for energy line
    const energyPath = plotSvg.append("path")
        .attr("class", "energy-line")
        .attr("fill", "none")
        .attr("stroke", "steelblue")
        .attr("stroke-width", 2);

    // Initialize state
    let currentState = network.resetState(0.05);
    let isUpdating = false;
    let updateCount = 0;
    let selectedStimulus = null;

    // Optimized update display using Canvas
    function updateDisplay() {
        const min = Math.min(...currentState);
        const max = Math.max(...currentState);

        // Update Canvas image data
        for (let i = 0; i < currentState.length; i++) {
            const value = currentState[i];
            const color = d3.interpolateRdBu((value + 1) / 2);  // Scale to [0,1]

            const {r, g, b} = d3.rgb(color).rgb();
            const idx = i * 4;
            imageData.data[idx] = r;
            imageData.data[idx + 1] = g;
            imageData.data[idx + 2] = b;
            imageData.data[idx + 3] = 255;
        }

        ctx.putImageData(imageData, 0, 0);

        // Calculate energy
        const currentEnergy = network.energy();
        energyHistory.push(currentEnergy);
        if (energyHistory.length > maxHistoryLength) {
            energyHistory.shift();
        }

        // Update y-scale domain based on energy range
        if (energyHistory.length > 1) {
            const minEnergy = Math.min(...energyHistory);
            const maxEnergy = Math.max(...energyHistory);
            const padding = (maxEnergy - minEnergy) * 0.1 || 1;
            yScale.domain([minEnergy - padding, maxEnergy + padding]);

            // Update y-axis
            plotSvg.select(".y-axis")
                .transition()
                .duration(50)
                .call(yAxis);
        }

        // Update energy line
        energyPath.datum(energyHistory)
            .attr("d", line);

        // Update energy display
        energyDisplay.html(
            `Energy: ${currentEnergy.toFixed(3)} | ` +
            `Min Activity: ${min.toFixed(2)} | ` +
            `Max Activity: ${max.toFixed(2)} | ` +
            `Updates: ${updateCount}`
        );

        updateBtn.text(isUpdating ? "Stop" : "Update");
    }

    // Create controls
    const controls = container.append("div")
        .classed("neural-controls", true) // Add class for styling
        .style("display", "flex")
        .style("gap", "0.5rem")
        .style("flex-wrap", "wrap")
        .style("justify-content", "center");

    // Network parameters controls
    const paramControls = container.append("div")
        .style("display", "flex")
        .style("gap", "1rem")
        .style("flex-wrap", "wrap")
        .style("justify-content", "center")
        .style("margin-top", "0.5rem");

    // Add sliders for parameters
    const tauControl = paramControls.append("div").classed("param-slider", true);
    tauControl.append("label")
        .text("Time Constant (τ): ")
        .style("margin-right", "0.5rem");
    const tauSlider = tauControl.append("input")
        .attr("type", "range")
        .attr("min", "0.1")
        .attr("max", "5")
        .attr("step", "0.1")
        .attr("value", network.tau)
        .on("input", function() {
            network.tau = +this.value;
            tauValue.text(network.tau.toFixed(1));
        });
    const tauValue = tauControl.append("span")
        .text(network.tau.toFixed(1));

    const thresholdControl = paramControls.append("div").classed("param-slider", true);
    thresholdControl.append("label")
        .text("Threshold: ")
        .style("margin-right", "0.5rem");
    const thresholdSlider = thresholdControl.append("input")
        .attr("type", "range")
        .attr("min", "-0.5")
        .attr("max", "0.5")
        .attr("step", "0.05")
        .attr("value", network.threshold)
        .on("input", function() {
            network.threshold = +this.value;
            thresholdValue.text(network.threshold.toFixed(2));
        });
    const thresholdValue = thresholdControl.append("span")
        .text(network.threshold.toFixed(2));

    // Add buttons
    const resetBtn = controls.append("button")
        .text("Reset")
        .on("click", resetNetwork);

    const updateBtn = controls.append("button")
        .text("Update")
        .on("click", updateState);

    const noiseBtn = controls.append("button")
        .text("Add Noise")
        .on("click", addNoise);

    // Add stimulus buttons
    stimuli.forEach((stimulus, i) => {
        controls.append("button")
            .text(`Stimulus ${i + 1}`)
            .on("click", () => applyStimulus(i));
    });

    // Add energy display
    const energyDisplay = container.append("div")
        .style("font-family", "monospace")
        .style("margin-top", "1rem");

    // Add interactive drawing
    let isDrawing = false;
    canvas
        .on("mousedown", () => {
            isDrawing = true;
            network.state = currentState;
        })
        .on("mousemove", (event) => {
            if (!isDrawing) return;

            const rect = canvas.node().getBoundingClientRect();
            const x = Math.floor((event.clientX - rect.left) / cellSize);
            const y = Math.floor((event.clientY - rect.top) / cellSize);
            const idx = y * WIDTH + x;

            if (idx >= 0 && idx < currentState.length) {
                currentState[idx] = 1.0;
                updateDisplay();
            }
        })
        .on("mouseup mouseleave", () => {
            isDrawing = false;
        });

    // Add parameter presets
    const presets = controls.append("div")
        .style("display", "flex")
        .style("gap", "0.5rem");

    presets.append("button")
        .text("Bump Stability")
        .on("click", () => {
            network.tau = 1.0;
            network.threshold = 0.1;
            tauSlider.property("value", 1.0);
            thresholdSlider.property("value", 0.1);
            tauValue.text("1.0");
            thresholdValue.text("0.10");
        });

    presets.append("button")
        .text("Pattern Competition")
        .on("click", () => {
            network.tau = 0.5;
            network.threshold = -0.2;
            tauSlider.property("value", 0.5);
            thresholdSlider.property("value", -0.2);
            tauValue.text("0.5");
            thresholdValue.text("-0.20");
        });

    // Add speed control
    const speedControl = paramControls.append("div").classed("param-slider", true);
    speedControl.append("label").text("Speed:");
    const speedSlider = speedControl.append("input")
        .attr("type", "range")
        .attr("min", "1")
        .attr("max", "100")
        .attr("value", "50")
        .style("width", "100px");

    // Update loop using requestAnimationFrame
    let lastTime = 0;
    function update(timestamp) {
        if (!isUpdating) return;

        const deltaTime = timestamp - lastTime;
        if (deltaTime > 1000 / speedSlider.property("value")) {
            currentState = network.update(0.1);
            updateCount++;
            updateDisplay();
            lastTime = timestamp;

            if (updateCount >= 500) stopUpdating();
        }
        requestAnimationFrame(update);
    }

    function startUpdating() {
        isUpdating = true;
        lastTime = performance.now();
        requestAnimationFrame(update);
    }

    function stopUpdating() {
        isUpdating = false;
        updateDisplay();
    }

    function resetNetwork() {
        if (isUpdating) stopUpdating();
        currentState = network.resetState(0.05);
        selectedStimulus = null;
        updateCount = 0;
        energyHistory = [];  // Reset energy history
        updateDisplay();
    }

    function addNoise() {
        if (isUpdating) return;
        // Add small noise to the current state
        for (let i = 0; i < currentState.length; i++) {
            currentState[i] += (Math.random() * 0.4 - 0.2);
        }
        updateCount = 0;
        updateDisplay();
    }

    function updateState() {
        if (!isUpdating) startUpdating();
        else stopUpdating();
    }

    function applyStimulus(index) {
        stopUpdating();
        selectedStimulus = index;
        currentState = network.initializeWithStimulus(stimuli[index], 1.0);
        updateCount = 0;
        energyHistory = [];  // Reset energy history
        updateDisplay();
    }

    // Initial display update
    updateDisplay();
}

    window.document.addEventListener("DOMContentLoaded", function (event) {
      const toggleBodyColorMode = (bsSheetEl) => {
        const mode = bsSheetEl.getAttribute("data-mode");
        const bodyEl = window.document.querySelector("body");
        if (mode === "dark") {
          bodyEl.classList.add("quarto-dark");
          bodyEl.classList.remove("quarto-light");
        } else {
          bodyEl.classList.add("quarto-light");
          bodyEl.classList.remove("quarto-dark");
        }
      }
      const toggleBodyColorPrimary = () => {
        const bsSheetEl = window.document.querySelector("link#quarto-bootstrap");
        if (bsSheetEl) {
          toggleBodyColorMode(bsSheetEl);
        }
      }
      toggleBodyColorPrimary();  
      const tabsets =  window.document.querySelectorAll(".panel-tabset-tabby")
      tabsets.forEach(function(tabset) {
        const tabby = new Tabby('#' + tabset.id);
      });
      const isCodeAnnotation = (el) => {
        for (const clz of el.classList) {
          if (clz.startsWith('code-annotation-')) {                     
            return true;
          }
        }
        return false;
      }
      const onCopySuccess = function(e) {
        // button target
        const button = e.trigger;
        // don't keep focus
        button.blur();
        // flash "checked"
        button.classList.add('code-copy-button-checked');
        var currentTitle = button.getAttribute("title");
        button.setAttribute("title", "Copied!");
        let tooltip;
        if (window.bootstrap) {
          button.setAttribute("data-bs-toggle", "tooltip");
          button.setAttribute("data-bs-placement", "left");
          button.setAttribute("data-bs-title", "Copied!");
          tooltip = new bootstrap.Tooltip(button, 
            { trigger: "manual", 
              customClass: "code-copy-button-tooltip",
              offset: [0, -8]});
          tooltip.show();    
        }
        setTimeout(function() {
          if (tooltip) {
            tooltip.hide();
            button.removeAttribute("data-bs-title");
            button.removeAttribute("data-bs-toggle");
            button.removeAttribute("data-bs-placement");
          }
          button.setAttribute("title", currentTitle);
          button.classList.remove('code-copy-button-checked');
        }, 1000);
        // clear code selection
        e.clearSelection();
      }
      const getTextToCopy = function(trigger) {
          const codeEl = trigger.previousElementSibling.cloneNode(true);
          for (const childEl of codeEl.children) {
            if (isCodeAnnotation(childEl)) {
              childEl.remove();
            }
          }
          return codeEl.innerText;
      }
      const clipboard = new window.ClipboardJS('.code-copy-button:not([data-in-quarto-modal])', {
        text: getTextToCopy
      });
      clipboard.on('success', onCopySuccess);
      if (window.document.getElementById('quarto-embedded-source-code-modal')) {
        const clipboardModal = new window.ClipboardJS('.code-copy-button[data-in-quarto-modal]', {
          text: getTextToCopy,
          container: window.document.getElementById('quarto-embedded-source-code-modal')
        });
        clipboardModal.on('success', onCopySuccess);
      }
        var localhostRegex = new RegExp(/^(?:http|https):\/\/localhost\:?[0-9]*\//);
        var mailtoRegex = new RegExp(/^mailto:/);
          var filterRegex = new RegExp("https:\/\/theghoul21\.github\.io\/");
        var isInternal = (href) => {
            return filterRegex.test(href) || localhostRegex.test(href) || mailtoRegex.test(href);
        }
        // Inspect non-navigation links and adorn them if external
     	var links = window.document.querySelectorAll('a[href]:not(.nav-link):not(.navbar-brand):not(.toc-action):not(.sidebar-link):not(.sidebar-item-toggle):not(.pagination-link):not(.no-external):not([aria-hidden]):not(.dropdown-item):not(.quarto-navigation-tool):not(.about-link)');
        for (var i=0; i<links.length; i++) {
          const link = links[i];
          if (!isInternal(link.href)) {
            // undo the damage that might have been done by quarto-nav.js in the case of
            // links that we want to consider external
            if (link.dataset.originalHref !== undefined) {
              link.href = link.dataset.originalHref;
            }
          }
        }
      function tippyHover(el, contentFn, onTriggerFn, onUntriggerFn) {
        const config = {
          allowHTML: true,
          maxWidth: 500,
          delay: 100,
          arrow: false,
          appendTo: function(el) {
              return el.closest('section.slide') || el.parentElement;
          },
          interactive: true,
          interactiveBorder: 10,
          theme: 'light-border',
          placement: 'bottom-start',
        };
        if (contentFn) {
          config.content = contentFn;
        }
        if (onTriggerFn) {
          config.onTrigger = onTriggerFn;
        }
        if (onUntriggerFn) {
          config.onUntrigger = onUntriggerFn;
        }
          config['offset'] = [0,0];
          config['maxWidth'] = 700;
        window.tippy(el, config); 
      }
      const noterefs = window.document.querySelectorAll('a[role="doc-noteref"]');
      for (var i=0; i<noterefs.length; i++) {
        const ref = noterefs[i];
        tippyHover(ref, function() {
          // use id or data attribute instead here
          let href = ref.getAttribute('data-footnote-href') || ref.getAttribute('href');
          try { href = new URL(href).hash; } catch {}
          const id = href.replace(/^#\/?/, "");
          const note = window.document.getElementById(id);
          if (note) {
            return note.innerHTML;
          } else {
            return "";
          }
        });
      }
      const findCites = (el) => {
        const parentEl = el.parentElement;
        if (parentEl) {
          const cites = parentEl.dataset.cites;
          if (cites) {
            return {
              el,
              cites: cites.split(' ')
            };
          } else {
            return findCites(el.parentElement)
          }
        } else {
          return undefined;
        }
      };
      var bibliorefs = window.document.querySelectorAll('a[role="doc-biblioref"]');
      for (var i=0; i<bibliorefs.length; i++) {
        const ref = bibliorefs[i];
        const citeInfo = findCites(ref);
        if (citeInfo) {
          tippyHover(citeInfo.el, function() {
            var popup = window.document.createElement('div');
            citeInfo.cites.forEach(function(cite) {
              var citeDiv = window.document.createElement('div');
              citeDiv.classList.add('hanging-indent');
              citeDiv.classList.add('csl-entry');
              var biblioDiv = window.document.getElementById('ref-' + cite);
              if (biblioDiv) {
                citeDiv.innerHTML = biblioDiv.innerHTML;
              }
              popup.appendChild(citeDiv);
            });
            return popup.innerHTML;
          });
        }
      }
    });
